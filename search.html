<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="bg-phases" content="everyday survive stabilize rebuild thrive">
<meta name="bg-priority" content="normal">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Search — BreakGlass</title>
<script>(function(){try{var t=localStorage.getItem("bg.theme");if(!t){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css?v=2">
<link rel="stylesheet" href="assets/theme.css?v=2">
<style>
.search-meta{margin:0 0 var(--space-4);color:var(--text-muted);font-size:var(--fs-sm)}
.result{margin-bottom:var(--space-3)}
.card-title{font-size:var(--fs-lg);font-weight:700}
.result-path{margin:0 0 var(--space-2);color:var(--text-muted);font-size:var(--fs-xs);overflow-wrap:anywhere}
.result-snippet{margin:0;font-size:var(--fs-sm)}
#selftest-out{overflow:auto;font-size:var(--fs-xs)}
.result.is-selected{outline:2px solid var(--accent);outline-offset:2px}
.chips-label{margin-top:var(--space-3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-2)}
.didyou{cursor:pointer}
.didyou:hover,.didyou:focus-visible{color:var(--text);border-color:var(--accent)}
</style>
<script src="assets/shell.js?v=2" defer></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html"><i class="fa-solid fa-box-open"></i> BREAKGLASS</a>
<form class="searchbar" action="search.html" role="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" name="q" placeholder="Search everything…" aria-label="Search"></form>
<select class="phase-select" aria-label="Situation phase"></select>
<button class="btn btn-ghost" type="button" data-action="toggle-theme" aria-pressed="false" title="Toggle light/dark"><i class="fa-solid fa-circle-half-stroke"></i></button>
</header>
<main>
<h1>Search</h1>
<section id="search-results" aria-live="polite"></section>
</main>
<footer class="status-line"><span><a href="how-to-use.html">How to use this site</a></span><span data-media-state>Media pack: checking…</span><span>BreakGlass © <span data-year></span></span></footer>
<script>
(function () {
  "use strict";

  var RT = {};
  window.BGSearchRuntime = RT;

  var STOPWORDS = ["a","an","and","the","of","to","in","is","it","on","for","with","as","at","by","from","or","this","that","these","those","be","are","was","were","will","would","can","could","should","do","does","did","not","but","if","then","than","so","such","into","about","your","you","we","our","they","their","its","has","have","had","i"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  RT.esc = esc;

  function foldWord(w) {
    return w.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  }

  RT.normalizeQuery = function (s) {
    var folded = foldWord(String(s || "").toLowerCase());
    var parts = folded.split(/[^a-z0-9]+/);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var w = parts[i];
      if (w.length < 2) continue;
      if (STOPWORDS.indexOf(w) !== -1) continue;
      out.push(w);
    }
    return out;
  };

  function titleHasTerm(title, term) {
    var tokens = foldWord(String(title || "").toLowerCase()).split(/[^a-z0-9]+/);
    return tokens.indexOf(term) !== -1;
  }

  RT.scoreDocs = function (docs, buckets, rawQuery, terms) {
    var hits = {};
    var order = [];
    var phrase = String(rawQuery || "").trim().toLowerCase();
    for (var i = 0; i < terms.length; i++) {
      var shard = buckets ? buckets[String(terms[i]).charAt(0)] : null;
      var postings = shard ? shard[terms[i]] : null;
      if (!postings) continue;
      for (var j = 0; j < postings.length; j++) {
        var id = postings[j][0];
        var tf = postings[j][1] || 1;
        if (!Object.prototype.hasOwnProperty.call(hits, id)) {
          hits[id] = { score: 0, terms: [] };
          order.push(id);
        }
        hits[id].score += tf;
        if (hits[id].terms.indexOf(terms[i]) === -1) hits[id].terms.push(terms[i]);
      }
    }
    var results = [];
    for (var k = 0; k < order.length; k++) {
      var id = order[k];
      var doc = docs ? docs[id] : null;
      if (!doc) continue;
      var h = hits[id];
      for (var m = 0; m < h.terms.length; m++) {
        if (titleHasTerm(doc.t, h.terms[m])) h.score += 2.5;
      }
      if (phrase) {
        var tl = String(doc.t || "").toLowerCase();
        var xl = String(doc.x || "").toLowerCase();
        if (tl.indexOf(phrase) !== -1 || xl.indexOf(phrase) !== -1) h.score += 8;
      }
      results.push({ id: id, doc: doc, score: h.score, terms: h.terms });
    }
    results.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.doc.t < b.doc.t ? -1 : a.doc.t > b.doc.t ? 1 : 0;
    });
    return results;
  };

  RT.buildSnippet = function (x, terms, matched) {
    var text = String(x || "");
    var wanted = (matched && matched.length) ? matched : terms;
    var lower = text.toLowerCase();
    var pos = -1;
    for (var i = 0; i < terms.length; i++) {
      var idx = lower.indexOf(terms[i]);
      if (idx !== -1 && (pos === -1 || idx < pos)) pos = idx;
    }
    var start, end;
    if (pos === -1) {
      start = 0;
      end = Math.min(text.length, 160);
    } else {
      start = Math.max(0, pos - 80);
      end = Math.min(text.length, pos + 80);
    }
    var prefix = start > 0 ? "…" : "";
    var suffix = end < text.length ? "…" : "";
    var window = text.slice(start, end);
    var set = {};
    for (var w = 0; w < wanted.length; w++) set[wanted[w]] = true;
    var html = "";
    var runRe = /[A-Za-z0-9]+/g;
    var last = 0;
    var m;
    while ((m = runRe.exec(window)) !== null) {
      if (m.index > last) html += esc(window.slice(last, m.index));
      var tok = foldWord(m[0].toLowerCase());
      if (set[tok]) html += "<mark>" + esc(m[0]) + "</mark>";
      else html += esc(m[0]);
      last = m.index + m[0].length;
    }
    html += esc(window.slice(last));
    return prefix + html + suffix;
  };

  var SECTION_MAP = {
    "emergency": "Emergency Hub",
    "medical": "Medical & Health",
    "howto": "How-To & Skills",
    "food": "Food & Water",
    "comms": "Comms & Radio",
    "wiki": "Offline Wiki",
    "books": "Book Library",
    "faith": "Faith & Bible",
    "education": "Education",
    "ask": "Ask-the-Kit",
    "id": "ID Browser",
    "town": "Town Builder",
    "maps": "Maps & Navigation",
    "pets": "Pets & Animals",
    "reference": "Quick Reference",
    "apps": "Pocket Apps",
    "calc": "Calculators",
    "admin": "Kit Admin",
    "arcade": "Arcade"
  };

  function sectionPath(u) {
    var parts = String(u || "").split("/");
    if (parts.length < 2) return "Home";
    var head = parts.shift();
    var name = Object.prototype.hasOwnProperty.call(SECTION_MAP, head) ? SECTION_MAP[head] : head;
    var dirs = parts.slice(0, -1);
    for (var i = 0; i < dirs.length; i++) {
      if (dirs[i] && dirs[i] !== "index.html") name += " › " + dirs[i];
    }
    return name;
  }

  function letterSet(w) {
    var set = {};
    for (var i = 0; i < w.length; i++) set[w.charAt(i)] = true;
    return set;
  }

  function countKeys(set) {
    var n = 0;
    for (var k in set) {
      if (Object.prototype.hasOwnProperty.call(set, k)) n++;
    }
    return n;
  }

  var dictCache = null;

  function dictionary() {
    if (dictCache) return dictCache;
    var docs = window.BG_SEARCH_DOCS || {};
    var ids = Object.keys(docs);
    var seen = {};
    var words = [];
    for (var i = 0; i < ids.length; i++) {
      var doc = docs[ids[i]];
      var text = String(doc.t || "") + " " + String(doc.x || "");
      var toks = foldWord(text.toLowerCase()).split(/[^a-z0-9]+/);
      for (var j = 0; j < toks.length; j++) {
        var w = toks[j];
        if (w.length < 3 || STOPWORDS.indexOf(w) !== -1 || seen[w]) continue;
        seen[w] = true;
        words.push(w);
      }
    }
    dictCache = words;
    return words;
  }

  function suggestFor(terms) {
    var dict = dictionary();
    var scored = [];
    for (var q = 0; q < terms.length; q++) {
      var qset = letterSet(terms[q]);
      var qn = countKeys(qset);
      for (var i = 0; i < dict.length; i++) {
        var cand = dict[i];
        if (cand === terms[q]) continue;
        var cset = letterSet(cand);
        var cn = countKeys(cset);
        var shared = 0;
        for (var c in cset) {
          if (!Object.prototype.hasOwnProperty.call(cset, c)) continue;
          if (qset[c]) shared++;
        }
        var union = qn + cn - shared;
        if (!union) continue;
        var ratio = shared / union;
        if (ratio >= 0.6) scored.push({ w: cand, r: ratio });
      }
    }
    scored.sort(function (a, b) {
      if (b.r !== a.r) return b.r - a.r;
      return a.w < b.w ? -1 : a.w > b.w ? 1 : 0;
    });
    var picked = [];
    var used = {};
    for (var s = 0; s < scored.length && picked.length < 5; s++) {
      if (used[scored[s].w]) continue;
      used[scored[s].w] = true;
      picked.push(scored[s].w);
    }
    return picked;
  }

  function suggestionsHtml(terms) {
    var picks = suggestFor(terms);
    if (!picks.length) return "";
    var html = '<p class="chips-label">Did you mean:</p><div class="chips">';
    for (var i = 0; i < picks.length; i++) {
      html += '<button type="button" class="badge didyou" data-suggest="' + esc(picks[i]) + '">' + esc(picks[i]) + "</button>";
    }
    return html + "</div>";
  }

  var attempted = {};

  function loadScript(src) {
    if (attempted[src]) return Promise.resolve();
    return new Promise(function (resolve) {
      attempted[src] = true;
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { resolve(); };
      document.head.appendChild(s);
    });
  }

  RT.loadShards = function (terms) {
    return loadScript("assets/search/docs.js").then(function () {
      return loadScript("assets/search/manifest.js");
    }).then(function () {
      var keys = Array.isArray(window.BG_SEARCH_KEYS) ? window.BG_SEARCH_KEYS : [];
      var want = {};
      for (var i = 0; i < terms.length; i++) want[String(terms[i]).charAt(0)] = true;
      var chain = Promise.resolve();
      var loadedKeys = [];
      for (var k = 0; k < keys.length; k++) {
        (function (key) {
          if (!want[key]) return;
          loadedKeys.push(key);
          chain = chain.then(function () {
            return loadScript("assets/search/bucket-" + key + ".js");
          });
        })(keys[k]);
      }
      return chain.then(function () { return loadedKeys; });
    });
  };

  function getBuckets() {
    return window.BG_SEARCH_BUCKETS || {};
  }

  function el(id) {
    return document.getElementById(id);
  }

  function renderEmpty(out, raw) {
    out.innerHTML =
      '<div class="card">' +
      "<h3>Quick links</h3>" +
      "<p><a href=\"a-z.html\">A–Z Index</a> · " +
      "<a href=\"emergency/index.html\">Emergency Hub</a> · " +
      "<a href=\"medical/index.html\">Medical</a> · " +
      "<a href=\"howto/index.html\">How-To</a> · " +
      "<a href=\"howto/water-treatment.html\">Water Treatment</a> · " +
      "<a href=\"medical/dosing-by-weight.html\">Dosing by Weight</a></p>" +
      "<p>Type a few words above — try things like <a href=\"search.html?q=water\">water</a>, " +
      "<a href=\"search.html?q=bleeding\">bleeding</a>, " +
      "<a href=\"search.html?q=bible\">bible</a>, or " +
      "<a href=\"search.html?q=calculator\">calculator</a>.</p>" +
      "</div>";
    if (raw != null) document.title = "Search — BreakGlass";
  }

  function renderSearching(out, raw) {
    out.innerHTML =
      '<div class="card"><p role="status">Searching for “' + esc(raw) + '”…</p></div>';
    document.title = "Search: " + raw + " — BreakGlass";
  }

  function renderResults(out, raw, results, ms, terms) {
    var meta = '<p class="search-meta">' + esc(results.length) + ' results for “' + esc(raw) + '” · ' + esc(ms) + ' ms</p>';
    if (!results.length) {
      out.innerHTML =
        meta +
        '<div class="callout callout-info">' +
        "<h3>Nothing found</h3>" +
        "<p>Try fewer or more general words, or browse the " +
        '<a href="a-z.html">A–Z index</a> instead.</p>' +
        suggestionsHtml(terms) +
        "</div>";
      wireSuggestions(out);
      return;
    }
    var html = meta;
    var top = results.slice(0, 20);
    for (var i = 0; i < top.length; i++) {
      var r = top[i];
      html +=
        '<article class="card result">' +
        '<h2 style="margin:0 0 var(--space-1)"><a class="card-title" href="' + esc(r.doc.u) + '">' + esc(r.doc.t) + '</a></h2>' +
        '<p class="result-path">' + esc(sectionPath(r.doc.u)) + '</p>' +
        '<p class="result-snippet">' + RT.buildSnippet(r.doc.x, r.terms, r.terms) + '</p>' +
        '</article>';
    }
    out.innerHTML = html;
  }

  function wireSuggestions(out) {
    var chips = out.querySelectorAll("button[data-suggest]");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function () {
        submitQuery(this.getAttribute("data-suggest"));
      });
    }
  }

  function nowMs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  var cards = [];
  var selIdx = -1;

  function resetSelection() {
    cards = Array.prototype.slice.call(el("search-results").querySelectorAll("article.result"));
    selIdx = -1;
  }

  function moveSelection(delta) {
    if (!cards.length) return;
    var next = selIdx + delta;
    if (next < 0) next = 0;
    if (next > cards.length - 1) next = cards.length - 1;
    if (next === selIdx) return;
    if (selIdx >= 0 && cards[selIdx]) cards[selIdx].classList.remove("is-selected");
    selIdx = next;
    cards[selIdx].classList.add("is-selected");
    try {
      cards[selIdx].scrollIntoView({ block: "nearest" });
    } catch (e) {}
  }

  function run(raw) {
    var out = el("search-results");
    var terms = RT.normalizeQuery(raw);
    if (!terms.length) {
      renderEmpty(out, raw);
      resetSelection();
      return Promise.resolve();
    }
    renderSearching(out, raw);
    resetSelection();
    var t0 = nowMs();
    return RT.loadShards(terms).then(function () {
      var results = RT.scoreDocs(window.BG_SEARCH_DOCS || {}, getBuckets(), raw, terms);
      renderResults(out, raw, results, Math.max(1, Math.round(nowMs() - t0)), terms);
      resetSelection();
    }).catch(function () {
      renderEmpty(out, null);
      resetSelection();
    });
  }

  function selftest() {
    var TERMS = ["water", "emergency", "search", "zzzqqq"];
    var all = [];
    for (var i = 0; i < TERMS.length; i++) {
      var ts = RT.normalizeQuery(TERMS[i]);
      for (var j = 0; j < ts.length; j++) {
        if (all.indexOf(ts[j]) === -1) all.push(ts[j]);
      }
    }
    return RT.loadShards(all).then(function (loadedKeys) {
      var docs = window.BG_SEARCH_DOCS || {};
      var buckets = getBuckets();
      var per = {};
      for (var i = 0; i < TERMS.length; i++) {
        var r = RT.scoreDocs(docs, buckets, TERMS[i], RT.normalizeQuery(TERMS[i]));
        var top = [];
        for (var k = 0; k < r.length && k < 3; k++) {
          top.push({ u: r[k].doc.u, t: r[k].doc.t });
        }
        per[TERMS[i]] = { count: r.length, top: top };
      }
      return { loadedKeys: loadedKeys, docCount: Object.keys(docs).length, resultsPerTerm: per };
    });
  }

  function params() {
    try {
      return new URLSearchParams(location.search);
    } catch (e) {
      var out = {};
      String(location.search).replace(/^\?/, "").split("&").forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split("=");
        out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
      });
      return {
        get: function (k) { return Object.prototype.hasOwnProperty.call(out, k) ? out[k] : null; }
      };
    }
  }

  var main = document.querySelector("main");
  var form = document.querySelector(".searchbar");
  var input = form ? form.querySelector("input[name='q']") : null;

  var sp = params();

  if (sp.get("selftest") === "1") {
    var h1 = main.querySelector("h1");
    while (h1.nextSibling) main.removeChild(h1.nextSibling);
    var pre = document.createElement("pre");
    pre.id = "selftest-out";
    main.appendChild(pre);
    selftest().then(function (report) {
      pre.textContent = JSON.stringify(report, null, 2);
    }).catch(function (e) {
      pre.textContent = JSON.stringify({ error: String(e) }, null, 2);
    });
    return;
  }

  function submitQuery(val) {
    if (input) input.value = val;
    try {
      history.replaceState(null, "", location.pathname + "?q=" + encodeURIComponent(val) + location.hash);
    } catch (e) {}
    run(val);
  }

  if (input) {
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (selIdx >= 0 && cards[selIdx]) {
        var link = cards[selIdx].querySelector("a.card-title");
        if (link && link.href) {
          location.href = link.href;
          return;
        }
      }
      submitQuery(input.value);
    });
  }

  document.addEventListener("keydown", function (ev) {
    var tgt = ev.target;
    if (tgt && tgt !== input && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.tagName === "SELECT")) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      moveSelection(ev.key === "ArrowDown" ? 1 : -1);
    } else if (ev.key === "Escape") {
      if (selIdx >= 0 && cards[selIdx]) cards[selIdx].classList.remove("is-selected");
      selIdx = -1;
      if (tgt === input) input.blur();
    }
  });

  run(sp.get("q") || "");
})();
</script>
</body>
</html>
